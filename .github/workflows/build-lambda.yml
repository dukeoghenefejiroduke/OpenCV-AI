name: Build and Test Lambda Package

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Build and Test Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Existing Tests
      run: |
        PYTHONPATH=. python3 tests/test_inspection.py

    - name: Build Lambda Deployment Package
      run: |
        mkdir -p lambda_build
        pip install numpy==1.26.4 opencv-python-headless==5.0.0.93 --target lambda_build --no-deps
        cp lambda_handler.py lambda_build/
        cp -r vision lambda_build/
        
        # Clean up pycache, pyc
        find lambda_build -name "__pycache__" -type d -exec rm -rf {} +
        find lambda_build -name "*.pyc" -delete

        # Measure sizes
        python3 -c "
        import os
        sz = sum(os.path.getsize(os.path.join(dp, f)) for dp, dn, filenames in os.walk('lambda_build') for f in filenames)
        print(f'Actual Uncompressed Size: {sz / (1024*1024):.2f} MB')
        "

        cd lambda_build
        zip -r ../cementsight_lambda.zip .
        cd ..

        python3 -c "
        import os
        sz = os.path.getsize('cementsight_lambda.zip')
        print(f'Actual ZIP Size: {sz / (1024*1024):.2f} MB')
        "

    - name: Verify Linux Runtime Import (OpenCV 5 & NumPy)
      run: |
        export PYTHONPATH=lambda_build
        python3 -c "
        import numpy as np
        import cv2
        print('NumPy version:', np.__version__)
        print('OpenCV version:', cv2.__version__)
        assert np.__version__ == '1.26.4', f'Expected NumPy 1.26.4, got {np.__version__}'
        assert cv2.__version__.startswith('5.0.0'), f'Expected OpenCV 5.0.0, got {cv2.__version__}'
        "

    - name: Test Lambda Handler with data/pipe_corrosion.jpg
      run: |
        export PYTHONPATH=lambda_build
        python3 -c "
        import base64, json
        from lambda_handler import lambda_handler

        with open('data/pipe_corrosion.jpg', 'rb') as f:
            b64 = base64.b64encode(f.read()).decode('utf-8')

        event = {
            'headers': {'content-type': 'application/json'},
            'body': json.dumps({'image_base64': b64})
        }

        resp = lambda_handler(event, None)
        print('Lambda response status:', resp['statusCode'])
        assert resp['statusCode'] == 200, f'Expected status 200, got {resp[\"statusCode\"]}'

        body = json.loads(resp['body'])
        assert body['success'] is True
        print('Inspection success:', body['success'])
        print('Inspection recommendation:', body['inspection']['recommendation'])
        print('Inspection corrosion %:', body['inspection']['corrosion_percentage'])
        print('Inspection regions count:', body['inspection']['region_count'])
        "

    - name: Print Required Summary Block
      run: |
        PYTHONPATH=lambda_build python3 -c "
        import sys, numpy as np, cv2, os
        zip_sz = os.path.getsize('cementsight_lambda.zip') / (1024*1024)
        uncomp_sz = sum(os.path.getsize(os.path.join(dp, f)) for dp, dn, filenames in os.walk('lambda_build') for f in filenames) / (1024*1024)
        print('=== CEMENTSIGHT LAMBDA BUILD ===')
        print('Python:', sys.version.split()[0])
        print('NumPy:', np.__version__)
        print('OpenCV:', cv2.__version__)
        print('Architecture:', os.uname().machine)
        print(f'ZIP size: {zip_sz:.2f} MB')
        print(f'Uncompressed size: {uncomp_sz:.2f} MB')
        print('Lambda limit: 250 MB')
        print('OpenCV 5 runtime test: PASSED')
        print('Lambda handler test: PASSED')
        print('Existing tests: PASSED')
        print('=== END ===')
        "

    - name: Upload Lambda ZIP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cementsight-lambda-zip
        path: cementsight_lambda.zip
