<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="1500" viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #f8fafc; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; rx: 8px; ry: 8px; }
    .header-box { fill: #1e293b; rx: 8px; ry: 8px; }
    .sub-box { fill: #f1f5f9; stroke: #e2e8f0; stroke-width: 1.5px; rx: 6px; ry: 6px; }
    .accent-box { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2px; rx: 6px; ry: 6px; }
    .warn-box { fill: #fefce8; stroke: #eab308; stroke-width: 2px; rx: 6px; ry: 6px; }
    .crit-box { fill: #fef2f2; stroke: #ef4444; stroke-width: 2px; rx: 6px; ry: 6px; }
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 24px; font-weight: bold; fill: #ffffff; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #94a3b8; }
    .section-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: bold; fill: #0f172a; }
    .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; fill: #334155; }
    .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: bold; fill: #1e293b; }
    .small-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #64748b; }
    .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
  </style>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" class="bg"/>

  <!-- Title Banner -->
  <rect x="40" y="30" width="1120" height="70" class="header-box"/>
  <text x="65" y="62" class="title">CementSight AI — Architecture &amp; Execution Workflow</text>
  <text x="65" y="85" class="subtitle">Industrial Corrosion Inspection &amp; Deterministic Agentic Decision Layer</text>

  <!-- COLUMN 1: Core Pipeline & Agent (x: 40, w: 540) -->
  <rect x="40" y="120" width="540" height="1340" class="box"/>
  <text x="65" y="155" class="section-title">Core Inspection &amp; Agent Workflow</text>

  <!-- User Input -->
  <rect x="70" y="180" width="480" height="50" class="sub-box"/>
  <text x="90" y="210" class="text-bold">1. User / Inspector / Client Request</text>

  <path d="M 310 230 L 310 260" class="arrow"/>

  <!-- Input Validation -->
  <rect x="70" y="260" width="480" height="70" class="sub-box"/>
  <text x="90" y="285" class="text-bold">2. Input Safety Validation (app/validation.py)</text>
  <text x="90" y="305" class="small-text">• Verify file existence &amp; decodability • Min dimensions: 128x128 pixels</text>
  <text x="90" y="320" class="small-text">• Reject undersized (32x32) or corrupt images (HTTP 400 / Exit 1)</text>

  <path d="M 310 330 L 310 360" class="arrow"/>

  <!-- OpenCV Pipeline -->
  <rect x="70" y="360" width="480" height="180" class="sub-box"/>
  <text x="90" y="385" class="text-bold">3. OpenCV Vision Pipeline (vision/inspection.py — Frozen)</text>
  <text x="90" y="410" class="text">• Gaussian Blur &amp; HSV Rust Segmentation (Range: [5,50,50] to [25,255,255])</text>
  <text x="90" y="430" class="text">• Structural Foreground ROI Mask (Canny edges + morphology)</text>
  <text x="90" y="450" class="text">• Extent Filtering (extent ≥ 0.15, reject giant frame-spanning contours)</text>
  <text x="90" y="470" class="text">• Output: Corrosion Percentage (%), Region Count, Bounding Boxes</text>
  <text x="90" y="495" class="small-text" fill="#b91c1c">Note: Screening estimate only; not a certified physical measurement.</text>

  <path d="M 310 540 L 310 570" class="arrow"/>

  <!-- Agent Decision Layer -->
  <rect x="70" y="570" width="480" height="150" class="accent-box"/>
  <text x="90" y="595" class="text-bold">4. Deterministic Agent Decision Layer (agent/decision.py)</text>
  <text x="90" y="620" class="text">• PASS (&lt; 2.0%): Normal equipment status recorded</text>
  <text x="90" y="640" class="text">• WARNING (2.0%–&lt;10.0%): Routine maintenance inspection proposed</text>
  <text x="90" y="660" class="text">• CRITICAL (≥ 10.0%): Emergency work-order request proposed</text>
  <text x="90" y="685" class="small-text" fill="#1d4ed8">Zero LLMs • Zero Randomness • Pure Rule-Based Logic</text>

  <path d="M 310 720 L 310 750" class="arrow"/>

  <!-- Decision Branching -->
  <rect x="70" y="750" width="220" height="120" class="sub-box"/>
  <text x="85" y="775" class="text-bold">PASS / WARNING</text>
  <text x="85" y="800" class="text">• Normal status / Routine</text>
  <text x="85" y="820" class="text">• approval_required = False</text>
  <text x="85" y="840" class="small-text">No supervisor block</text>

  <rect x="310" y="750" width="240" height="120" class="crit-box"/>
  <text x="325" y="775" class="text-bold" fill="#b91c1c">CRITICAL STATE</text>
  <text x="325" y="800" class="text" fill="#b91c1c">• approval_required = True</text>
  <text x="325" y="820" class="text" fill="#991b1b">• Awaiting Supervisor Review</text>
  <text x="325" y="840" class="small-text" fill="#991b1b">NO AUTOMATIC DISPATCH</text>

  <path d="M 180 870 L 180 910 L 310 910" class="arrow"/>
  <path d="M 430 870 L 430 910" class="arrow"/>

  <!-- Proposed Action -->
  <rect x="70" y="910" width="480" height="70" class="sub-box"/>
  <text x="90" y="935" class="text-bold">5. Proposed Maintenance Action / Work-Order Request</text>
  <text x="90" y="955" class="small-text">Local system generates structured proposals; never modifies external systems.</text>

  <path d="M 310 980 L 310 1010" class="arrow"/>

  <!-- Output / Evidence Path -->
  <rect x="70" y="1010" width="480" height="160" class="sub-box"/>
  <text x="90" y="1035" class="text-bold">6. Output &amp; Evidence Path</text>
  <text x="90" y="1060" class="text">• Vision Evidence: Corrosion %, Regions, Bounding Boxes, Recommendation</text>
  <text x="90" y="1080" class="text">• Agent Evidence: Decision, Proposed Action, Approval Flag, Reason</text>
  <text x="90" y="1100" class="text">• Delivery Formats: JSON Response, CLI Report, API Response</text>
  <text x="90" y="1125" class="small-text">Evaluated via tools/evaluate.py &amp; 34 automated unit/robustness tests.</text>

  <!-- COLUMN 2: Environments & Deployment (x: 600, w: 560) -->
  <rect x="600" y="120" width="560" height="1340" class="box"/>
  <text x="625" y="155" class="section-title">Execution Environments &amp; Deployment Target</text>

  <!-- Local Development -->
  <rect x="630" y="180" width="500" height="170" class="sub-box"/>
  <text x="650" y="205" class="text-bold">Local Development Environment</text>
  <text x="650" y="230" class="text">• Platform: Android / Termux (ARM64)</text>
  <text x="650" y="250" class="text">• Python 3.14.6 • NumPy 2.x</text>
  <text x="650" y="270" class="text">• OpenCV 4.14.0 (compatible local fallback wheel)</text>
  <text x="650" y="295" class="small-text" fill="#b91c1c">Why OpenCV 4 locally? OpenCV 5 wheels are incompatible with ARM64/Python 3.14.</text>
  <text x="650" y="315" class="small-text">Core algorithm (vision/inspection.py) is 100% shared with cloud target.</text>

  <path d="M 880 350 L 880 380" class="arrow"/>

  <!-- CI Verification -->
  <rect x="630" y="380" width="500" height="120" class="accent-box"/>
  <text x="650" y="405" class="text-bold">GitHub Actions CI Pipeline</text>
  <text x="650" y="430" class="text">• Linux x86_64 Runner • Python 3.11 • NumPy 2.2.3</text>
  <text x="650" y="450" class="text">• OpenCV 5.0.0.93 (opencv-python-headless)</text>
  <text x="650" y="475" class="small-text" fill="#1d4ed8">Automated build, test suite execution, and Lambda packaging verified.</text>

  <path d="M 880 500 L 880 530" class="arrow"/>

  <!-- Competition / AWS Target -->
  <rect x="630" y="530" width="500" height="240" class="warn-box"/>
  <text x="650" y="555" class="text-bold" fill="#b45309">Competition / AWS Target (Serverless)</text>
  <text x="650" y="580" class="text">• AWS Lambda (Amazon Linux) via Function URL</text>
  <text x="650" y="600" class="text">• lambda_handler.py (JSON Base64 API + Input Validation)</text>
  <text x="650" y="620" class="text">• Runtime: Python 3.11, NumPy 2.2.3, OpenCV 5.0.0.93</text>
  <text x="650" y="640" class="text">• Lambda Package: 74.10 MB (Compressed) / 207.86 MB (Uncompressed)</text>
  <text x="650" y="670" class="text-bold" fill="#b91c1c">Current Status: LIVE DEPLOYMENT PENDING ACCOUNT ACTIVATION</text>
  <text x="650" y="695" class="small-text" fill="#78350f">Artifact built and verified in CI; live endpoint not active or claimed.</text>

  <!-- Legend & Notes -->
  <rect x="630" y="800" width="500" height="370" class="sub-box"/>
  <text x="650" y="830" class="section-title">Architecture Legend &amp; Guarantees</text>
  
  <rect x="650" y="855" width="20" height="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="685" y="870" class="text">Standard Pipeline Stage</text>

  <rect x="650" y="895" width="20" height="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="685" y="910" class="text">Deterministic Agent Layer</text>

  <rect x="650" y="935" width="20" height="20" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="685" y="950" class="text">Critical Safety / Approval Block</text>

  <rect x="650" y="975" width="20" height="20" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
  <text x="685" y="990" class="text">Cloud Target (Pending Activation)</text>

  <text x="650" y="1035" class="text-bold">Key Engineering Guarantees:</text>
  <text x="650" y="1055" class="small-text">• Zero LLM dependency or hallucination risk (100% deterministic rules)</text>
  <text x="650" y="1075" class="small-text">• Frozen OpenCV vision pipeline (vision/inspection.py untouched)</text>
  <text x="650" y="1095" class="small-text">• 34/34 automated tests passing across inspection, agent, &amp; validation</text>
  <text x="650" y="1115" class="small-text">• Reproducible evaluation harness with machine-readable JSON reports</text>

</svg>
