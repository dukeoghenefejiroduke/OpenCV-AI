# CementSight AI — Production Nginx Secure Gateway Configuration (TLS & Reverse Proxy)
# Recommended deployment pattern for exposing CementSight AI securely behind an authenticated TLS gateway.

server {
    listen 80;
    server_name cementsight.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cementsight.local;

    ssl_certificate /etc/ssl/certs/cementsight_chain.pem;
    ssl_certificate_key /etc/ssl/private/cementsight_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Basic Authentication or OAuth2 Gateway Protection
    auth_basic "CementSight Engineering Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8989;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeout settings for heavy OpenCV image/video inspections
        proxy_read_timeout 120s;
        proxy_connect_timeout 120s;
    }
}
